<!doctype html>
<html lang="am" class="theme-light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#78350f" />
    <meta name="description" content="ዝክረ ቅዱሳን — የኢትዮጵያ ኦርቶዶክስ ተዋሕዶ ቤተክርስቲያን የቅዱሳን መታሰቢያና ስንክሳር (Zikere Kidusan — Commemorating the Saints)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="/fonts/Menbere-Variable.ttf" as="font" type="font/ttf" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>ዝክረ ቅዱሳን — Zikere Kidusan</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('synaxarium_theme');
          var theme = (saved === 'dark' || saved === 'sepia' || saved === 'light') ? saved : 'light';
          var root = document.documentElement;
          root.classList.remove('theme-light', 'theme-sepia', 'theme-dark', 'dark');
          root.classList.add('theme-' + theme);
          if (theme === 'dark') {
            root.classList.add('dark');
          }
          var lang = localStorage.getItem('synaxarium_language');
          if (lang === 'en' || lang === 'am') root.lang = lang;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>

  </body>
</html>
