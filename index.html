<!doctype html>
<html lang="am" class="theme-light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#78350f" />
    <meta name="description" content="ዝክረ ቅዱሳን — የኢትዮጵያ ኦርቶዶክስ ተዋሕዶ ቤተክርስቲያን የቅዱሳን መታሰቢያና ስንክሳር (Zikere Kidusan — Commemorating the Saints)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Noto+Serif+Ethiopic:wght@400;500;600;700;800;900&family=Yrsa:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <title>ዝክረ ቅዱሳን — Zikere Kidusan</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('synaxarium_theme');
          var theme = (saved === 'dark' || saved === 'sepia' || saved === 'light') ? saved : 'light';
          var root = document.documentElement;
          root.classList.remove('theme-light', 'theme-sepia', 'theme-dark', 'dark');
          root.classList.add('theme-' + theme);
          if (theme === 'dark') {
            root.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {})
        })
      }
    </script>
  </body>
</html>
